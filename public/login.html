<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AsefAI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #111111;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    .login-logo {
      width: 56px; height: 56px;
      background: #ffffff;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(255,255,255,0.12);
    }

    .login-logo svg { color: #0a0a0a; }

    .login-title {
      text-align: center;
    }

    .login-title h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .login-title p {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 10px rgba(255,255,255,0.1);
    }

    .btn-google:hover {
      background: #e8e8e8;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255,255,255,0.15);
    }

    .btn-google:active { transform: translateY(0); }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-google svg { flex-shrink: 0; }

    .loading-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      width: 100%;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12.5px;
      text-align: center;
      display: none;
    }

    .login-footer {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/>
        <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Title -->
    <div class="login-title">
      <h1>Selamat datang di AsefAI</h1>
      <p>Login untuk mulai menggunakan<br/>AI Chat yang cerdas dan responsif</p>
    </div>

    <div class="divider"></div>

    <!-- Error message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Google Login Button -->
    <button class="btn-google" id="btnGoogle">
      <!-- Google icon -->
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span id="btnGoogleText">Lanjutkan dengan Google</span>
      <div class="loading-spinner" id="btnSpinner"></div>
    </button>

    <p class="login-footer">
      Dengan login, kamu menyetujui penggunaan<br/>
      data untuk layanan AsefAI.
    </p>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBywDv13f0_psOCQuubzpQx53lwwEYqt8s",
      authDomain: "syafaproject1.firebaseapp.com",
      projectId: "syafaproject1",
      storageBucket: "syafaproject1.firebasestorage.app",
      messagingSenderId: "722247897392",
      appId: "1:722247897392:web:29f4221a793fe864be38f5",
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    const btnGoogle    = document.getElementById('btnGoogle');
    const btnText      = document.getElementById('btnGoogleText');
    const btnSpinner   = document.getElementById('btnSpinner');
    const errorMsg     = document.getElementById('errorMsg');

    // Kalau sudah login, langsung redirect ke chat
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '/';
      }
    });

    // Klik login Google
    btnGoogle.addEventListener('click', async () => {
      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged akan handle redirect
      } catch (err) {
        console.error('Login error:', err.code);
        let msg = 'Login gagal. Silakan coba lagi.';
        if (err.code === 'auth/popup-closed-by-user') msg = 'Login dibatalkan.';
        if (err.code === 'auth/network-request-failed') msg = 'Tidak ada koneksi internet.';
        showError(msg);
        setLoading(false);
      }
    });

    function setLoading(val) {
      btnGoogle.disabled = val;
      btnText.textContent = val ? 'Memproses...' : 'Lanjutkan dengan Google';
      btnSpinner.style.display = val ? 'block' : 'none';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>

</body>
</html>
